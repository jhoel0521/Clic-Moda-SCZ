# Infraestructura de DESARROLLO del monorepo (base de datos y, más adelante, otros servicios).
# Se maneja con el orquestador de la raíz: pnpm docker:up | docker:down | docker:logs | docker:reset
#
# - Puertos: salen de ports.json (infra: 10001-10009); el orquestador exporta DB_PORT.
# - Credenciales: services/api/.env (ignorado por git); el orquestador lo pasa con --env-file.
# - Postgres 18: el volumen se monta en /var/lib/postgresql (no en .../data como en versiones previas).
# - El script de inicialización va en línea (configs.content) y no como montaje de una carpeta del
#   host: en algunos equipos Windows Docker Desktop no comparte ciertas unidades (p. ej. J:) y el
#   montaje llega vacío.
# - Solo se ejecuta la primera vez que se crea el volumen; para repetirlo: pnpm docker:reset.
name: clic-moda

configs:
  init-test-db:
    content: |
      CREATE DATABASE clic_moda_test;
  # Identidad S3 de SeaweedFS (las claves salen de services/api/.env). Solo la API las usa.
  seaweedfs-s3:
    content: |
      {"identities":[{"name":"api","credentials":[{"accessKey":"${S3_ACCESS_KEY:?Define S3_ACCESS_KEY en services/api/.env}","secretKey":"${S3_SECRET_KEY:?Define S3_SECRET_KEY en services/api/.env}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}

services:
  postgres:
    image: postgres:18-alpine
    container_name: clic-moda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-clic_moda}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en services/api/.env}
      POSTGRES_DB: clic_moda
    ports:
      - '${DB_PORT:-10001}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    configs:
      - source: init-test-db
        target: /docker-entrypoint-initdb.d/01-create-test-db.sql
    healthcheck:
      # Sano solo cuando la inicialización terminó: existe también la base de pruebas.
      test:
        - CMD-SHELL
        - >-
          pg_isready -U ${DB_USER:-clic_moda} -d clic_moda &&
          psql -U ${DB_USER:-clic_moda} -d clic_moda_test -Atc 'select 1' > /dev/null
      interval: 3s
      timeout: 3s
      retries: 20

  # Almacenamiento de imágenes (S3). Aislado: solo la API lo consulta y el bucket es privado.
  # En desarrollo se publica únicamente en 127.0.0.1; en producción NO se publica ningún puerto.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: clic-moda-seaweedfs
    restart: unless-stopped
    command: server -dir=/data -master.volumeSizeLimitMB=256 -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '127.0.0.1:${S3_PORT:-10002}:8333'
    volumes:
      - seaweeddata:/data
    configs:
      - source: seaweedfs-s3
        target: /etc/seaweedfs/s3.json
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://$$(hostname -i):9333/cluster/status > /dev/null || exit 1']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  seaweeddata:
